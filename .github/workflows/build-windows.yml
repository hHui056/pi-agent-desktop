# 自动打包：推送到 main 或打 tag 时，在 GitHub 的 Windows runner 上跑
# 「npm ci → 类型检查 → 准备自带运行时 → electron-builder」，并上传 zip 产物。
#
# 为什么 CI 里一定要跑 `npm run setup`：
#   electron-builder.yml 的 extraResources 指向 `build/pi` 和 `vendor/node/node.exe`，
#   这两个路径都被 .gitignore 排除，仓库里并不存在。只跑 `npm ci && npm run build`
#   再打包，会因为 extraResources 的源目录缺失而失败。
name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 需要

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 打包 Windows 产物
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 决策 #3：自用、不签名。关掉证书探测，避免 runner 上出现签名相关报错。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # seed-runtime.mjs 强制要求 >= 22.19.0；这里用当前 LTS 主线。
          node-version: '24'
          cache: npm

      - name: 安装依赖
        # npm 11 会跳过依赖的 install 脚本，Electron 二进制不会自动下载，
        # 由后面的 `npm run setup` 调用 ensure-electron.mjs 补上。
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 准备 Electron 二进制与自带运行时
        # ensure-electron.mjs（补下载 Electron）+ seed-runtime.mjs（装 build/pi、复制 node.exe）
        run: npm run setup

      - name: 打包
        # dist:win 已带 --publish never，发布交给下面的 Release 步骤。
        run: npm run dist:win

      - name: 上传 zip 产物
        uses: actions/upload-artifact@v4
        with:
          name: pi-agent-desktop-win-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
