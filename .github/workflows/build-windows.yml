# 自动打包：推送到 main 或打 tag 时，在 GitHub 的 Windows runner 上跑
# 「npm ci → 类型检查 → 准备自带运行时 → 编译 → electron-builder」，并上传 zip 产物。
#
# 为什么 CI 里一定要跑 `npm run setup`：
#   electron-builder.yml 的 extraResources 指向 `build/pi` 和 `vendor/node/node.exe`，
#   这两个路径都被 .gitignore 排除，仓库里并不存在。只跑 `npm ci && npm run build`
#   再打包，会因为 extraResources 的源目录缺失而失败。
name: build-windows

on:
  push:
    branches: [main]
    # 打 tag 才出 Release。两种版本号习惯都认：0.1.0 与 v0.1.0。
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 需要

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 打包 Windows 产物
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 决策 #3：自用、不签名。关掉证书探测，避免 runner 上出现签名相关报错。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # seed-runtime.mjs 强制要求 >= 22.19.0；这里用当前 LTS 主线。
          node-version: '24'
          cache: npm

      - name: 安装依赖
        # npm 11 会跳过依赖的 install 脚本，Electron 二进制不会自动下载，
        # 由后面的 `npm run setup` 调用 ensure-electron.mjs 补上。
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 准备 Electron 二进制与自带运行时
        # ensure-electron.mjs（补下载 Electron）+ seed-runtime.mjs（装 build/pi、复制 node.exe）
        run: npm run setup

      # 编译与打包分成两步，失败时能一眼看出是哪一半挂的。
      # 两处都用 Tee-Object 留一份日志，供下面的「失败诊断」步骤转成注解。
      - name: 编译
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: 打包
        shell: pwsh
        run: |
          npx electron-builder --win --publish never 2>&1 | Tee-Object -FilePath package.log
          exit $LASTEXITCODE

      # 失败时把日志尾部写成 workflow 注解：它出现在 Checks 页面，也能通过
      # check-runs API 读到，不必登录后台翻原始日志。
      - name: 失败诊断
        if: failure()
        shell: pwsh
        run: |
          $lines = @()
          foreach ($file in @('build.log', 'package.log')) {
            if (Test-Path $file) {
              $lines += "===== $file ====="
              $lines += Get-Content $file -Tail 40
            }
          }
          if ($lines.Count -eq 0) { $lines = @('没有捕获到日志') }
          $lines | ForEach-Object { Write-Host $_ }
          $text = ($lines -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
          Write-Host "::error title=CI失败日志::$text"

      - name: 上传 zip 产物
        uses: actions/upload-artifact@v4
        with:
          name: pi-agent-desktop-win-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
